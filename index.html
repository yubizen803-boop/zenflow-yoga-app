<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZenFlow Yoga — Book a Class</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0faf4; color: #222; }
    .container { max-width: 820px; margin: 0 auto; padding: 20px; }
    nav { background: #2d6a4f; padding: 14px 20px; border-radius: 10px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 28px; }
    nav .brand { color: white; font-weight: 700; font-size: 20px; margin-right: 8px; }
    nav button { background: transparent; color: white; border: 1.5px solid rgba(255,255,255,0.6); border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 14px; transition: all .2s; }
    nav button.active { background: white; color: #2d6a4f; font-weight: 700; border-color: white; }
    h1 { color: #1b4332; margin-bottom: 20px; font-size: 26px; }
    .card { background: white; border: 1px solid #b7e4c7; border-radius: 12px; padding: 18px; margin-bottom: 14px; }
    .card-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .class-name { font-size: 18px; font-weight: 700; color: #1b4332; }
    .class-meta { color: #555; margin: 5px 0; font-size: 14px; }
    .class-price { color: #2d6a4f; font-weight: 700; font-size: 15px; }
    .btn { background: #2d6a4f; color: white; border: none; border-radius: 8px; padding: 11px 22px; cursor: pointer; font-size: 15px; font-weight: 600; transition: background .2s; }
    .btn:hover { background: #1b4332; }
    .btn-outline { background: transparent; color: #888; border: 1px solid #ccc; border-radius: 8px; padding: 10px 18px; cursor: pointer; font-size: 14px; margin-top: 8px; }
    .btn-pay { background: #2d6a4f; color: white; border: none; border-radius: 8px; padding: 15px; cursor: pointer; font-size: 18px; font-weight: 700; width: 100%; margin-top: 8px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; color: #333; font-size: 14px; }
    input, select { width: 100%; padding: 11px 14px; border: 1.5px solid #ccc; border-radius: 8px; font-size: 15px; outline: none; transition: border .2s; }
    input:focus, select:focus { border-color: #2d6a4f; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .summary-box { background: #d8f3dc; border-radius: 10px; padding: 16px; margin-bottom: 20px; }
    .summary-box p { color: #1b4332; margin-bottom: 4px; }
    .summary-total { font-size: 22px; font-weight: 700; color: #2d6a4f; margin-top: 8px; }
    .success-box { background: #d8f3dc; border: 2px solid #2d6a4f; border-radius: 12px; padding: 32px; text-align: center; }
    .success-icon { font-size: 56px; }
    .success-title { color: #2d6a4f; font-size: 24px; font-weight: 700; margin: 10px 0 6px; }
    .error-msg { color: #c0392b; font-size: 14px; margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { background: #2d6a4f; color: white; padding: 11px 14px; text-align: left; }
    td { padding: 10px 14px; border-bottom: 1px solid #e8f5e9; }
    tr:nth-child(even) td { background: #f8fff9; }
    .revenue-bar { background: #d8f3dc; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; color: #1b4332; font-weight: 600; }
    .empty { color: #aaa; text-align: center; padding: 40px; font-size: 16px; }
    @media(max-width:600px){ .row-2{grid-template-columns:1fr;} .card-row{flex-direction:column; align-items:flex-start;} }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const CLASSES = [
  { id:1, name:'Morning Flow',   type:'Vinyasa', instructor:'Maya Chen',  time:'Mon/Wed/Fri 7:00 AM', spots:12, price:15 },
  { id:2, name:'Gentle Hatha',   type:'Hatha',   instructor:'David Park', time:'Tue/Thu 9:00 AM',     spots:10, price:15 },
  { id:3, name:'Power Yoga',     type:'Power',   instructor:'Maya Chen',  time:'Mon/Wed 6:00 PM',     spots:15, price:15 },
];

function App() {
  const [page, setPage] = useState('home');
  const [bookings, setBookings] = useState(() => JSON.parse(localStorage.getItem('zf_bookings') || '[]'));
  const [form, setForm] = useState({ name:'', email:'', classId:'' });
  const [pending, setPending] = useState(null);
  const [pay, setPay] = useState({ card:'', expiry:'', cvc:'' });
  const [payDone, setPayDone] = useState(false);
  const [payErr, setPayErr] = useState('');

  useEffect(() => localStorage.setItem('zf_bookings', JSON.stringify(bookings)), [bookings]);

  const go = (p) => setPage(p);

  const handleBook = (e) => {
    e.preventDefault();
    const cls = CLASSES.find(c => c.id === Number(form.classId));
    setPending({ ...form, className: cls.name, price: cls.price });
    go('payment');
  };

  const handlePay = (e) => {
    e.preventDefault();
    setPayErr('');
    if (pay.card.replace(/\s/g,'').length < 16) return setPayErr('Enter a valid 16-digit card number.');
    if (!/^\d{2}\/\d{2}$/.test(pay.expiry)) return setPayErr('Expiry must be MM/YY.');
    if (pay.cvc.length < 3) return setPayErr('CVC must be 3 digits.');
    const booking = { ...pending, date: new Date().toLocaleDateString(), id: Date.now(), paid: true };
    setBookings(prev => [...prev, booking]);
    setPayDone(true);
    setTimeout(() => {
      setPayDone(false); setPending(null);
      setForm({ name:'', email:'', classId:'' });
      setPay({ card:'', expiry:'', cvc:'' });
      go('home');
    }, 3500);
  };

  const fmtCard   = v => v.replace(/\D/g,'').slice(0,16).replace(/(.{4})/g,'$1 ').trim();
  const fmtExpiry = v => v.replace(/\D/g,'').slice(0,4).replace(/^(\d{2})(\d)/,'$1/$2');

  return (
    <div className="container">
      <nav>
        <span className="brand">🌿 ZenFlow Yoga</span>
        {[['home','🏠 Home'],['book','📝 Book'],['instructor','👩‍🏫 Instructor']].map(([p,label]) => (
          <button key={p} className={page===p?'active':''} onClick={()=>go(p)}>{label}</button>
        ))}
      </nav>

      {/* HOME */}
      {page==='home' && <>
        <h1>Upcoming Classes</h1>
        {CLASSES.map(cls => (
          <div key={cls.id} className="card">
            <div className="card-row">
              <div>
                <div className="class-name">{cls.name} <span style={{fontSize:13,fontWeight:400,color:'#40916c'}}>({cls.type})</span></div>
                <div className="class-meta">👩‍🏫 {cls.instructor} &nbsp;·&nbsp; ⏰ {cls.time}</div>
                <div className="class-price">💚 ${cls.price} per class &nbsp;·&nbsp; 🪑 {cls.spots} spots</div>
              </div>
              <button className="btn" onClick={()=>{ setForm(f=>({...f,classId:String(cls.id)})); go('book'); }}>Book Now</button>
            </div>
          </div>
        ))}
      </>}

      {/* BOOK */}
      {page==='book' && <>
        <h1>Book a Class</h1>
        <div className="card" style={{maxWidth:440}}>
          <form onSubmit={handleBook}>
            <div className="form-group">
              <label>Your Name</label>
              <input required placeholder="Jane Smith" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} />
            </div>
            <div className="form-group">
              <label>Email Address</label>
              <input required type="email" placeholder="jane@email.com" value={form.email} onChange={e=>setForm(f=>({...f,email:e.target.value}))} />
            </div>
            <div className="form-group">
              <label>Select a Class</label>
              <select required value={form.classId} onChange={e=>setForm(f=>({...f,classId:e.target.value}))}>
                <option value="">Choose a class...</option>
                {CLASSES.map(c=><option key={c.id} value={c.id}>{c.name} — {c.time} (${c.price})</option>)}
              </select>
            </div>
            <button type="submit" className="btn" style={{width:'100%',padding:13,fontSize:16}}>Continue to Payment →</button>
          </form>
        </div>
      </>}

      {/* PAYMENT */}
      {page==='payment' && pending && <>
        <h1>💳 Complete Payment</h1>
        {payDone ? (
          <div className="success-box">
            <div className="success-icon">✅</div>
            <div className="success-title">Payment Confirmed!</div>
            <p style={{color:'#555',marginTop:6}}>Your booking is complete. See you on the mat! 🧘</p>
          </div>
        ) : (
          <div className="card" style={{maxWidth:440}}>
            <div className="summary-box">
              <p>📋 <strong>{pending.className}</strong></p>
              <p style={{color:'#555',fontSize:14}}>👤 {pending.name} &nbsp;·&nbsp; ✉️ {pending.email}</p>
              <div className="summary-total">Total: $15.00</div>
            </div>
            <form onSubmit={handlePay}>
              <div className="form-group">
                <label>Card Number</label>
                <input required placeholder="1234 5678 9012 3456" value={pay.card} maxLength={19}
                  onChange={e=>setPay(p=>({...p,card:fmtCard(e.target.value)}))} />
              </div>
              <div className="row-2">
                <div className="form-group">
                  <label>Expiry Date</label>
                  <input required placeholder="MM/YY" value={pay.expiry} maxLength={5}
                    onChange={e=>setPay(p=>({...p,expiry:fmtExpiry(e.target.value)}))} />
                </div>
                <div className="form-group">
                  <label>CVC</label>
                  <input required placeholder="123" value={pay.cvc} maxLength={3}
                    onChange={e=>setPay(p=>({...p,cvc:e.target.value.replace(/\D/g,'').slice(0,3)}))} />
                </div>
              </div>
              {payErr && <p className="error-msg">⚠️ {payErr}</p>}
              <button type="submit" className="btn-pay">💳 Pay $15.00</button>
              <button type="button" className="btn-outline" style={{width:'100%'}} onClick={()=>go('book')}>← Back</button>
            </form>
          </div>
        )}
      </>}

      {/* INSTRUCTOR */}
      {page==='instructor' && <>
        <h1>👩‍🏫 Instructor Dashboard</h1>
        <div className="revenue-bar">
          📊 Total Bookings: <strong>{bookings.length}</strong> &nbsp;·&nbsp;
          💰 Revenue: <strong>${bookings.filter(b=>b.paid).length * 15}</strong>
        </div>
        {bookings.length===0 ? (
          <div className="empty">No bookings yet. Share your booking link to get started! 🧘</div>
        ) : (
          <table>
            <thead><tr>
              <th>Class</th><th>Student</th><th>Email</th><th>Date</th><th>Payment</th>
            </tr></thead>
            <tbody>
              {bookings.map(b => (
                <tr key={b.id}>
                  <td>{b.className}</td>
                  <td>{b.name}</td>
                  <td>{b.email}</td>
                  <td>{b.date}</td>
                  <td>{b.paid ? '✅ $15' : '⏳ Pending'}</td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
